[package]
name = "lez-node-ffi-poc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Abhishek Khaparde <khapardehuf@gmail.com>"]
description = "RFP-027 Proof-of-Concept: C FFI, RocksDB storage, stable cursors, and multi-tenant isolation"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "lez_node_ffi_poc"

[dependencies]
rocksdb = { version = "0.24", default-features = false, features = ["snappy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.17"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_ops"
harness = false

[build-dependencies]
cbindgen = "0.29"
